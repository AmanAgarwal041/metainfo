[package]
name = "metainfo-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
description = "MetaInfo scan engine: parses a page bundle and produces an SEO + AI-visibility report"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
wasm-bindgen = "0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
